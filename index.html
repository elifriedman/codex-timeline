<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex sessions</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><p class="eyebrow">CODEX / SESSION HISTORY</p><h1>Session timeline</h1><p class="sub">Every session, in context.</p></div>
    <div class="controls"><button id="prev" aria-label="Previous date">←</button><button id="today">Today</button><button id="next" aria-label="Next date">→</button><label>Date <input id="date" type="date"></label></div>
  </header>
  <main><section class="summary"><span id="day-label"></span><span id="count"></span></section><section id="timeline" class="timeline" aria-label="Session timeline"></section></main>
  <button id="details-backdrop" class="details-backdrop" type="button" tabindex="-1" aria-label="Close session details"></button>
  <aside id="details" class="details" inert aria-hidden="true" aria-labelledby="details-title">
    <div class="details-header"><div><p class="eyebrow">SESSION DETAILS</p><h2 id="details-title">Session</h2></div><button id="details-close" class="details-close" type="button" aria-label="Close session details">×</button></div>
    <p id="details-meta" class="details-meta"></p>
    <div class="details-section"><p class="details-label">AI summary</p><ul id="summary-list" class="summary-list"></ul><p id="summary-empty" class="summary-empty">No AI summary is available for this session.</p></div>
  </aside>
  <div id="tip" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
